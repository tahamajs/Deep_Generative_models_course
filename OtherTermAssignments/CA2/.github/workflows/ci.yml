name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install -r code/requirements.txt
          # Install CPU-only torch wheels for ubuntu
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision --extra-index-url https://download.pytorch.org/whl/cpu -q || true
      - name: Run tests
        run: |
          cd code
          pytest -q